<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Bitarr WebUI">
    <title>Bitarr</title>
    <link rel="icon" type="image/svg+xml" href="images/bitarr.svg">
    <link rel="stylesheet" href="css/app.css?v=${CACHEID}">
</head>

<body>
    <noscript><p class="noscript">JavaScript is required for the Bitarr WebUI.</p></noscript>
    <div id="app">
        <aside id="sidebar">
            <div class="brand"><img src="images/bitarr.svg" alt=""><span>Bitarr</span></div>
            <nav id="nav"></nav>
            <div id="filters"></div>
            <div class="sidebar-foot">
                <button type="button" class="nav-item" id="btnSettings"><img src="images/configure.svg" alt=""><span>Settings</span></button>
                <button type="button" class="nav-item" id="btnLogout"><img src="images/system-log-out.svg" alt=""><span>Log out</span></button>
            </div>
        </aside>
        <div id="scrim"></div>
        <main id="main">
            <div id="pages">
            <div class="page" id="page-transfers">
            <header class="topbar" id="topbar">
                <button type="button" class="icon-btn" id="btnMenu" aria-label="Menu">&#9776;</button>
                <div class="actions">
                    <button type="button" class="btn primary" id="btnAdd"><img src="images/list-add.svg" alt=""><span>Add</span></button>
                    <button type="button" class="btn" id="btnStart" disabled><img src="images/torrent-start.svg" alt=""><span>Resume</span></button>
                    <button type="button" class="btn" id="btnStop" disabled><img src="images/torrent-stop.svg" alt=""><span>Pause</span></button>
                    <button type="button" class="btn danger" id="btnDelete" disabled><img src="images/list-remove.svg" alt=""><span>Remove</span></button>
                </div>
                <label class="search"><img src="images/edit-find.svg" alt=""><input id="search" type="search" placeholder="Filter torrents..." autocomplete="off"></label>
            </header>
            <section id="tableWrap">
                <table id="torrents">
                    <thead><tr id="headRow"></tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
                <div id="empty" class="empty" hidden>No torrents to show.</div>
            </section>
            <section id="details">
                <div class="tabs" id="tabs" role="tablist"></div>
                <div id="tabBody" class="tab-body"></div>
            </section>
            </div>
            <section class="page stack" id="page-search" hidden></section>
            <section class="page stack" id="page-rss" hidden></section>
            <section class="page stack" id="page-log" hidden></section>
            <section class="page stack" id="page-stats" hidden></section>
            </div>
            <footer id="statusbar">
                <span id="connection" class="status-chip"></span>
                <span id="dht" class="status-chip"></span>
                <span id="disk" class="status-chip"></span>
                <span class="spacer"></span>
                <button type="button" class="status-chip button" id="btnAlt" title="Alternative speed limits"><img src="images/speedometer.svg" alt=""><span>Alt speeds</span></button>
                <span class="status-chip"><img src="images/download.svg" alt=""><span id="dlSpeed"></span></span>
                <span class="status-chip"><img src="images/upload.svg" alt=""><span id="upSpeed"></span></span>
            </footer>
        </main>
    </div>
    <div id="modalRoot"></div>
    <div id="toasts" aria-live="polite"></div>
    <script src="js/util.js?v=${CACHEID}"></script>
    <script src="js/api.js?v=${CACHEID}"></script>
    <script src="js/store.js?v=${CACHEID}"></script>
    <script src="js/dialogs.js?v=${CACHEID}"></script>
    <script src="js/pages.js?v=${CACHEID}"></script>
    <script src="js/details.js?v=${CACHEID}"></script>
    <script src="js/log.js?v=${CACHEID}"></script>
    <script src="js/search.js?v=${CACHEID}"></script>
    <script src="js/rss.js?v=${CACHEID}"></script>
    <script src="js/stats.js?v=${CACHEID}"></script>
    <script src="js/app.js?v=${CACHEID}"></script>
</body>

</html>
