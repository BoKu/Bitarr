name: Bug report
description: Report something in Bitarr that is not working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please:
        - Check that the problem still happens in the [latest release](https://github.com/BoKu/Bitarr/releases/latest).
        - Search the [existing issues](https://github.com/BoKu/Bitarr/issues?q=is%3Aissue), including closed ones.
        - Use [Discussions](https://github.com/BoKu/Bitarr/discussions) for questions, not issues.
  - type: input
    id: version
    attributes:
      label: Bitarr version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, Windows 11, Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Desktop app
        - WebUI
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant log lines or drag in screenshots. Remove anything private.
