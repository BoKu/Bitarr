name: Feature request
description: Suggest a new feature or an improvement for Bitarr.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the [existing issues](https://github.com/BoKu/Bitarr/issues?q=is%3Aissue)
        and the [latest release](https://github.com/BoKu/Bitarr/releases/latest) to see if it already exists.
        Use [Discussions](https://github.com/BoKu/Bitarr/discussions) for questions.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
